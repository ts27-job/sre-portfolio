services:

  mysql:
    image: mysql:9.7
    container_name: giants-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Destino0527
      MYSQL_DATABASE: giants_sre_dashboard

    ports:
      - "3307:3306"

    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: giants-backend
    environment:
      DB_USER: root
      DB_PASSWORD: Destino0527
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: giants_sre_dashboard

    ports:
      - "8000:8000"

    depends_on:
      - mysql