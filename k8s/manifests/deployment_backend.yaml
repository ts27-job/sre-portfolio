apiVersion: apps/v1
kind: Deployment
metadata:
  name: giants-deployment-backend
  namespace: giants-namespace

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: giants-app-backend

  template:
    metadata:
      labels:
        app: giants-app-backend

    spec:
      containers:
        - name: giants-container-backend
          image: 711427856586.dkr.ecr.ap-northeast-1.amazonaws.com/giants-ecr-backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: giants-config-backend
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: giants-config-backend
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: giants-config-backend
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: giants-secret-backend
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: giants-secret-backend
                  key: DB_PASSWORD

      terminationGracePeriodSeconds: 30