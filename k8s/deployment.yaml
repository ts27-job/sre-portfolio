apiVersion: apps/v1
kind: Deployment
metadata:
  name: giants-backend
  namespace: giants-sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app: giants-backend
  template:
    metadata:
      labels:
        app: giants-backend
    spec:
      containers:
        - name: giants-backend
          image: giants-sre-dashboard:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: giants-backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: giants-backend-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: giants-backend-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: giants-backend-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: giants-backend-secret
                  key: DB_PASSWORD