apiVersion: apps/v1
kind: Deployment
metadata:
  name: giants-deployment-backend
  namespace: giants-namespace
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: giants-app-backend
  template:
    metadata:
      labels:
        app: giants-app-backend
    spec:
      containers:
        - name: giants-container-backend
          image: 711427856586.dkr.ecr.ap-northeast-1.amazonaws.com/giants-ecr-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: giants-config-backend
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: giants-config-backend
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: giants-config-backend
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: giants-secret-backend
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: giants-secret-backend
                  key: DB_PASSWORD