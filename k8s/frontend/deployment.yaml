apiVersion: apps/v1
kind: Deployment
metadata:
  name: giants-deployment-frontend
  namespace: giants-namespace
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 2
  selector:
    matchLabels:
      app: giants-app-frontend
  template:
    metadata:
      labels:
        app: giants-app-frontend
    spec:
      containers:
        - name: giants-container-frontend
          image: 711427856586.dkr.ecr.ap-northeast-1.amazonaws.com/giants-ecr-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000